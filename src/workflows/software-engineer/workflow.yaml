version: 1
name: software-engineer
admission:
  instructions: >
    Use BYPASS for explanations, questions, typo fixes, and trivial changes.
    For substantial software work choose clarify when product requirements are
    missing, plan when requirements are clear, or build when a complete design
    already exists. Make routine engineering decisions without asking the user.
  entries: [clarify, plan, build]
capabilities:
  clarify:
    purpose: Resolve essential product ambiguity.
    instructions: >
      Read project context. Ask only product questions that tools cannot answer.
      If questions remain, report blocked with concrete questions. Otherwise
      record requirements and let Foreman select the next capability.
    completion: Requirements are clear enough to plan.
    tools:
      allow: [read, glob, grep]
    outputs:
      type: object
      additionalProperties: false
      required: [requirements]
      properties:
        requirements: {type: array, minItems: 1, items: {type: string}}
    append: [requirements]
    next:
      ready: [plan]
      incomplete: [clarify]
      blocked: [clarify]
  plan:
    purpose: Produce a concise design and finite verification contract.
    instructions: >
      Inspect requirements and code. Write task-specific design files under designs/ with implementation tasks,
      interfaces, and relevant failure cases. Choose descriptive filenames for each feature;
      revise existing designs only when deliberately updating that same feature.
      Report the paths in artifacts. Preserve existing requirements.
      Record acceptance labels and check commands in data. Every check must
      terminate with a meaningful exit code. Never register a standalone dev
      server or watch command. For runtime checks use a bounded smoke script
      that starts a service, checks readiness, asserts behavior, and cleans up.
      When repairing a broken check plan, preserve valid checks and the app.
    completion: The reported design artifacts and an executable acceptance contract exist.
    outputs:
      type: object
      additionalProperties: false
      required: [artifacts, acceptance, commands]
      properties:
        artifacts: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        acceptance: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        commands: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    append: [acceptance]
    gate: {files: plan.artifacts}
    next:
      ready: [build]
      incomplete: [plan, clarify]
      blocked: [plan, clarify]
  build:
    purpose: Implement or repair the requested software and tests.
    instructions: >
      Read the design paths in plan.artifacts when available and follow user intent. Implement and test the software with
      native tools. If fixing failed checks, make focused repairs without
      weakening the acceptance contract. If no design exists, document a
      concise task-specific design under designs/ first. Record finite commands and acceptance labels in
      data. Explicitly carry forward plan.acceptance when available, and retain
      your previous build.acceptance criteria when repairing. Outputs are scoped
      to their producing capability. Report ready when review can begin.
    completion: Implementation and a terminating check plan are ready.
    outputs:
      type: object
      additionalProperties: false
      required: [acceptance, commands]
      properties:
        acceptance: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        commands: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    append: [acceptance]
    next:
      ready: [review]
      incomplete: [build, plan, clarify]
      blocked: [plan, clarify, build]
  review:
    purpose: Check the current software against real execution evidence.
    dependsOn: [build]
    instructions: >
      Inspect the implementation and coverage. Execute every stored check
      exactly, one shell call per command from the project root. Do not change
      implementation or tests. Stop on failures or timeouts; report incomplete
      with a concrete repair description. If checks are perpetual or broken,
      report incomplete and explain the plan repair needed. Missing coverage
      is grounds for repair, even when commands pass. For ready, return covered
      containing every exact acceptance label. Do not restate checks in data.
    completion: All stored checks pass freshly and acceptance has been reviewed.
    tools:
      allow: [read, glob, grep, bash]
      declaredChecksOnly: true
    gate: {commands: build.commands, acceptance: build.acceptance}
    next:
      ready: [deliver]
      incomplete: [build, plan]
      blocked: [plan, build]
  deliver:
    purpose: Deliver the result with evidence and limitations.
    instructions: Summarize changes, checks actually run, setup instructions, and remaining limitations honestly.
    completion: The user receives the delivery report.
    dependsOn: [review]
    terminal: true
